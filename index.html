<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiches cingalais</title>
<style>body{font-family:system-ui,sans-serif;margin:0;padding:32px 16px;background:#f6f4f1;color:#1d1b1a;text-align:center}a{color:#8c1f33}</style>
</head>
<body>
<p id="m">Chargement…</p>
<noscript><p>Active JavaScript pour utiliser le site.</p></noscript>
<script>
/* Lanceur : ouvre la version du site que tu as installée. Elle ne change que si tu cliques sur « Mettre à jour ». */
(function(){
  var PK="cingalais-pinned-v1",FIRST="2.9",pinned=null;
  try{pinned=localStorage.getItem(PK);}catch(e){}
  if(pinned&&!/^[0-9.]+$/.test(pinned)){pinned=null;}
  function open(v){location.replace("app/"+v+".html"+location.hash);}
  function exists(v){return fetch("app/"+v+".html",{method:"HEAD",cache:"no-store"}).then(function(r){return r.ok;}).catch(function(){return false;});}
  function pin(v){try{localStorage.setItem(PK,v);}catch(e){}}
  if(pinned){
    exists(pinned).then(function(ok){
      if(ok){open(pinned);return;}
      /* version épinglée introuvable : on prend la dernière */
      latest(function(v){pin(v);open(v);});
    });
    return;
  }
  latest(function(v){pin(v);open(v);});
  function latest(cb){
    fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json();}).then(function(j){
      cb(j&&/^[0-9.]+$/.test(String(j.version))?String(j.version):FIRST);
    }).catch(function(){cb(FIRST);});
  }
})();
</script>
</body>
</html>
